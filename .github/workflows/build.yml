name: Build LiquidGlass LSP Module
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 替换为官方可用的Android SDK action
      - name: Setup Android SDK
        uses: manishdupati/setup-android-sdk@v1
        with:
          api-level: 34
          build-tools: "34.0.0"

      - name: Setup Gradle & generate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予执行权限
        run: chmod +x ./gradlew

      - name: 编译Debug安装包
        run: ./gradlew assembleDebug

      - name: 上传编译成品APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-apk
          path: app/build/outputs/apk/debug/*.apk
