name: Build LiquidGlass LSP Module
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 赋予脚本执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug 安装包
        run: ./gradlew assembleDebug

      - name: 上传编译成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-成品APK
          path: app/build/outputs/apk/debug/app-debug.apk
